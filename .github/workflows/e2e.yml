# Post-merge on main: Playwright drives the dashboard at phone and desktop sizes against a
# local Worker with fake services, and captures the Help screenshots (section 12c).
# Two jobs, one per login mode, so both are proven on every merge: `e2e` runs code mode (the
# email-code login staging keeps), `e2e-open` runs open mode (no login, as production runs).
# timeout-minutes is a fault detector (~4× normal), never a budget.
name: e2e

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Playwright (fake services)
        run: npm run e2e
        env:
          SESSION_SECRET: ci-session-secret
          SECRETS_KEY: 3Azr0CP6a687IwEqn9ZTM7gF9VgieHdcyXDvKd9Yo24=
          JOB_SHARED_SECRET: ci-job-secret
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            help/screenshots
          retention-days: 7

  e2e-open:
    runs-on: ubuntu-latest
    # ~1 min of tests on a normal run; 15 min is a fault detector, never a budget.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Playwright, open mode (no login, as production runs)
        run: npm run e2e:open
        env:
          SESSION_SECRET: ci-session-secret
          SECRETS_KEY: 3Azr0CP6a687IwEqn9ZTM7gF9VgieHdcyXDvKd9Yo24=
          JOB_SHARED_SECRET: ci-job-secret
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-open
          path: playwright-report-open
          retention-days: 7
