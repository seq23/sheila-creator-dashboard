# The full browser suite on main: Playwright drives the dashboard at phone and desktop sizes
# against a local Worker with fake services. A third job re-takes every Help picture (section
# 12c) and proves each step still has its own picture of that step (validator help-pictures).
# Two jobs, one per login mode: `e2e` runs code mode (the email-code login local dev and e2e keep),
# `e2e-open` runs open mode (no login, as production and the public sample run).
#
# BUILD FIRST, TEST IN BATCHES. This suite runs only when dispatched: by a person, by `land
# --promote sheila-creator-dashboard --run-e2e`, by `land <pr> --run-e2e`, or by `land` after a
# large change (the `large` block of `land` in seq23/seq-bin defines "large"). The merge gate is
# check.yml, and `land <pr>` deploys STAGING on every merge. After a LARGE change production
# deploys only from a commit this workflow has passed on: a successful dispatch on main triggers
# promote.yml; `land --promote` can also ship the newest green commit. A SMALL change ships on
# the fast check without this suite (owner decision, 2 Oct 2026; scripts/production-gate.mjs).
# A red run here blocks every small change until a green run is newer (known red), and is fixed
# first (bisect between the last green and the red sha).
# timeout-minutes is a fault detector (~4× normal), never a budget.
name: e2e

on:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Playwright (fake services)
        run: npm run e2e
        env:
          SESSION_SECRET: ci-session-secret
          SECRETS_KEY: 3Azr0CP6a687IwEqn9ZTM7gF9VgieHdcyXDvKd9Yo24=
          JOB_SHARED_SECRET: ci-job-secret
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  e2e-open:
    runs-on: ubuntu-latest
    # ~1 min of tests on a normal run; 15 min is a fault detector, never a budget.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Playwright, open mode (no login, as production runs)
        run: npm run e2e:open
        env:
          SESSION_SECRET: ci-session-secret
          SECRETS_KEY: 3Azr0CP6a687IwEqn9ZTM7gF9VgieHdcyXDvKd9Yo24=
          JOB_SHARED_SECRET: ci-job-secret
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-open
          path: playwright-report-open
          retention-days: 7

  help-screenshots:
    runs-on: ubuntu-latest
    # ~7 min locally for 339 steps x 2 sizes; 30 min is a fault detector (~4x), never a budget.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Every guide step, phone and desktop (fake services, demo data)
        run: npm run help:screenshots
        env:
          SESSION_SECRET: ci-session-secret
          SECRETS_KEY: 3Azr0CP6a687IwEqn9ZTM7gF9VgieHdcyXDvKd9Yo24=
          JOB_SHARED_SECRET: ci-job-secret
      - name: Each step has its own picture
        run: node scripts/validate.mjs help-pictures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: help-screenshots
          path: help/screenshots
          retention-days: 7
