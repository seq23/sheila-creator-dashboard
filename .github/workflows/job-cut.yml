# Cut a dump into clips (section 8). The `run` job is started ONLY by the Worker (repository_dispatch with a signed
# payload); it fetches its spec from the Worker, works in the runner, uploads to R2, calls back.
# Logs show step names, counts and pass/fail only (section 13).
#
# The `selftest` job runs the same pipeline on synthetic footage (jobs/selftest_cut.py) when the pipeline changes.
# It uses no secrets and never talks to the Worker or R2, so running it on pull requests is safe.
name: job-cut

on:
  repository_dispatch:
    types: [cut]
  pull_request:
    paths:
      - jobs/cut.py
      - jobs/common.py
      - jobs/selftest_cut.py
      - .github/workflows/job-cut.yml
  workflow_dispatch:

concurrency:
  group: job-cut-${{ github.event.client_payload.job_id || github.ref }}
  cancel-in-progress: false

env:
  JOB_HEAVY: "1"          # cut.py installs faster-whisper (and MediaPipe if it installs within a minute)
  WHISPER_MODEL: base
  GLOG_minloglevel: "2"   # MediaPipe's native logging: errors only
  HF_HUB_DISABLE_PROGRESS_BARS: "1"

jobs:
  run:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            jobs/requirements.txt
            jobs/cut.py
      - name: Whisper model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ env.WHISPER_MODEL }}-v1
      - name: System tools
        # libgles2 + libegl1: MediaPipe's Linux wheel loads GLES/EGL even for CPU face detection
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libgles2 libegl1 > /dev/null
      - run: pip install -q -r jobs/requirements.txt
      - name: Run
        run: python3 jobs/cut.py
        env:
          JOB_ID: ${{ github.event.client_payload.job_id }}
          JOB_NONCE: ${{ github.event.client_payload.nonce }}
          JOB_TS: ${{ github.event.client_payload.ts }}
          JOB_SIG: ${{ github.event.client_payload.sig }}
          WORKER_URL: ${{ github.event.client_payload.worker_url }}
          RUN_ID: ${{ github.run_id }}
          JOB_SHARED_SECRET: ${{ secrets.JOB_SHARED_SECRET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: sheila-creator-dashboard-files
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}

  selftest:
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25    # fault detector (~4x a normal run), never a budget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            jobs/requirements.txt
            jobs/cut.py
      - name: Whisper model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ env.WHISPER_MODEL }}-v1
      - name: System tools (ffmpeg with libass; GLES/EGL for MediaPipe; espeak-ng for a spoken sample)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libgles2 libegl1 espeak-ng > /dev/null
      - name: Pipeline self-test (synthetic footage, no secrets)
        run: python3 jobs/selftest_cut.py --require-heavy
