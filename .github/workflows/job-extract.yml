# Extract text from brand docs, OCR for scanned PDFs (section 5). Started ONLY by the Worker (repository_dispatch with a signed payload); the job
# fetches its spec from the Worker, works in the runner, calls back with a safe result.
# Logs show step names, counts and pass/fail only (section 13).
name: job-extract

on:
  repository_dispatch:
    types: [extract]

concurrency:
  group: job-extract-${{ github.event.client_payload.job_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            jobs/requirements.txt
            jobs/requirements-docs.txt
      - name: System tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng poppler-utils > /dev/null
      - run: pip install -q -r jobs/requirements.txt -r jobs/requirements-docs.txt
      - name: Run
        run: python3 jobs/extract.py
        env:
          JOB_ID: ${{ github.event.client_payload.job_id }}
          JOB_NONCE: ${{ github.event.client_payload.nonce }}
          JOB_TS: ${{ github.event.client_payload.ts }}
          JOB_SIG: ${{ github.event.client_payload.sig }}
          WORKER_URL: ${{ github.event.client_payload.worker_url }}
          RUN_ID: ${{ github.run_id }}
          JOB_SHARED_SECRET: ${{ secrets.JOB_SHARED_SECRET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: sheila-creator-dashboard-files
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
