<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Review</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2B55A0}a:hover{color:#1C3D78}
</style>
</helmet>
<div style="width: 1280px; height: 820px; display: flex; background: #F3F1EC; color: #1E1D1A; font-family: 'IBM Plex Sans', sans-serif;">
<dc-import name="Sidebar" active="Review" hint-size="220px,820px"></dc-import>
<main style="flex-grow: 1; box-sizing: border-box; padding: 32px 40px; display: flex; flex-direction: column; gap: 18px;">
<div style="display: flex; align-items: center; gap: 12px;">
<h1 style="margin: 0; flex-grow: 1; font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 700;">Review clips</h1>
<button type="button" style="min-height: 48px; padding: 0 20px; border-radius: 10px; border: 1px solid #1E1D1A; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600;">Reject all</button>
<button type="button" style="min-height: 48px; padding: 0 24px; border-radius: 10px; border: none; background: #2E6B3F; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600;">Approve all 18</button>
</div>
<div style="display: flex; align-items: center; gap: 8px; font-size: 14px;">
<span style="padding: 8px 14px; border-radius: 18px; background: #1E1D1A; color: #FFFFFF; font-weight: 600;">New 18</span>
<span style="padding: 8px 14px; border-radius: 18px; border: 1px solid #B8B3A8;">Approved 32</span>
<span style="padding: 8px 14px; border-radius: 18px; border: 1px solid #B8B3A8;">Rejected 4</span>
<span style="flex-grow: 1;"></span>
<span style="color: #5E5A52;">Dump: Sep 22 · Door A · sorted best first</span>
</div>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px;">
<sc-for list="{{clips}}" as="c" hint-placeholder-count="6">
<div style="background: #FFFFFF; border: 1px solid #D6D2C8; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px;">
<div style="height: 250px; border-radius: 8px; background: #E4E0D7; border: 1px dashed #9C978C; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; position: relative;">
<span style="width: 44px; height: 44px; border-radius: 22px; background: #1E1D1A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px;">▶</span>
<span style="font-size: 12px; color: #5E5A52;">9:16 · {{c.len}}</span>
<span style="position: absolute; top: 8px; left: 8px; font-size: 12px; font-weight: 600; background: #FFFFFF; border-radius: 6px; padding: 2px 6px;">Score {{c.score}}</span>
</div>
<div style="font-size: 14px; font-weight: 600; line-height: 1.3;">{{c.hook}}</div>
<div style="font-size: 12px; color: #5E5A52;">{{c.recipe}}</div>
<div style="display: flex; gap: 4px; font-size: 11px; font-weight: 600;">
<span style="padding: 2px 6px; border-radius: 4px; background: #ECE9E2;">TT</span>
<span style="padding: 2px 6px; border-radius: 4px; background: #ECE9E2;">IG</span>
<span style="padding: 2px 6px; border-radius: 4px; background: #ECE9E2;">YT</span>
<span style="flex-grow: 1;"></span>
<a href="#" style="font-weight: 500;">Edit</a>
</div>
<div style="display: flex; gap: 6px;">
<button type="button" aria-label="Approve" style="flex-grow: 1; min-height: 44px; border-radius: 8px; border: none; background: #2E6B3F; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600;">✓</button>
<button type="button" aria-label="Reject" style="flex-grow: 1; min-height: 44px; border-radius: 8px; border: 1px solid #1E1D1A; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600;">✕</button>
<button type="button" aria-label="Delete" style="width: 44px; min-height: 44px; border-radius: 8px; border: 1px solid #A8480F; background: #FFFFFF; color: #A8480F; display: flex; align-items: center; justify-content: center;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M19 6l-1 14H6L5 6"></path></svg>
</button>
</div>
</div>
</sc-for>
</div>
<div style="font-size: 13px; color: #5E5A52;">Edit opens: caption · hashtags · on-screen hook · platforms · reject reason. Delete asks to confirm and removes the file for good.</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    return { clips: [
      { hook: 'I almost didn’t post this…', recipe: 'Hook-first · New', len: '27s', score: 91 },
      { hook: 'The one habit that changed my mornings', recipe: 'Talking-head · New', len: '38s', score: 88 },
      { hook: 'POV: the kitchen after', recipe: 'Montage · New', len: '19s', score: 84 },
      { hook: 'Story time: the worst date', recipe: 'Story · New', len: '71s', score: 80 },
      { hook: '3 things I stopped buying', recipe: 'Hook-first · Recycled', len: '24s', score: 77 },
      { hook: 'Reply to @comment: yes, really', recipe: 'Talking-head · New', len: '33s', score: 72 }
    ] };
  }
}
</script>
</body>
</html>
